name: HomeCloud CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: node:24.21.0-bookworm-slim@sha256:51b1100cc2a83d370c6a60952e3f2989c8a43159d0e38586e090f3b3326efefd
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: homecloud_ci
          POSTGRES_USER: homecloud_ci
          POSTGRES_PASSWORD: disposable-ci-only
        options: >-
          --health-cmd "pg_isready -U homecloud_ci -d homecloud_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HOMECLOUD_TEST_DATABASE_URL: postgres://homecloud_ci:disposable-ci-only@postgres:5432/homecloud_ci
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates gcc libc6-dev git python3 util-linux
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - run: npm ci --no-audit
        working-directory: backend
      - run: sh native/build.sh
        working-directory: backend
      - run: python3 scripts/ci/test-release.py
      - run: python3 scripts/ci/test-provenance.py
      - name: Full suite as unprivileged user
        run: |
          chown -R node:node "$GITHUB_WORKSPACE"
          runuser -u node -- npm test -- --runInBand --json --outputFile=../backend-tests.json
        working-directory: backend
      - name: PostgreSQL suites must execute
        run: |
          node -e 'const r=require("./backend-tests.json");const s=r.testResults.filter(x=>x.name.endsWith(".postgres.spec.ts"));if(s.length<12||s.some(x=>x.status!=="passed"||!x.assertionResults.length||x.assertionResults.some(t=>t.status!=="passed")))process.exit(1)'
      - run: npm run lint
        working-directory: backend
      - run: npm run test:file-type:compiled
        working-directory: backend
      - name: Patched dependency runtime and multipart boundaries
        run: runuser -u node -- node --test --test-timeout=10000 test/dependency-security-runtime.cjs
        working-directory: backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-tests-${{ github.run_attempt }}
          path: backend-tests.json
          if-no-files-found: error
          retention-days: 14
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Pin normalized Compose API; preserve explicit false bind flags
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/homecloud-compose-bin"
          curl --fail --silent --show-error --location https://github.com/docker/compose/releases/download/v5.1.3/docker-compose-linux-x86_64 -o "$RUNNER_TEMP/homecloud-compose-bin/docker-compose"
          echo "a0298760c9772d2c06888fc8703a487c94c3c3b0134adeef830742a2fc7647b4  $RUNNER_TEMP/homecloud-compose-bin/docker-compose" | sha256sum --check
          chmod +x "$RUNNER_TEMP/homecloud-compose-bin/docker-compose"
          cat > "$RUNNER_TEMP/homecloud-compose-bin/docker" <<'SHIM'
          #!/bin/sh
          set -eu
          [ "$#" -ge 1 ] && [ "$1" = compose ] || { echo 'CI configuration helper supports compose only' >&2; exit 1; }
          shift
          exec "$(dirname "$0")/docker-compose" "$@"
          SHIM
          chmod +x "$RUNNER_TEMP/homecloud-compose-bin/docker"
          echo "$RUNNER_TEMP/homecloud-compose-bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/homecloud-compose-bin/docker" compose version --short)" = 5.1.3
      - run: docker compose version && python3 scripts/ci/compose-check.py
      - run: python3 deploy/linux/test_startup_gate.py
      - run: python3 scripts/ci/test-entrypoint.py
      - run: python3 deploy/linux/test_preflight.py
        env:
          HOMECLOUD_TEST_ROOT: ${{ github.workspace }}
  image-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - id: bases
        run: |
          python3 -c 'import json,os; d=json.load(open("scripts/ci/images.lock.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); [f.write(k+"="+v+"\n") for k,v in d.items()]'
      - id: source
        run: |
          git diff --quiet HEAD -- . ':(exclude)scripts/tests/PHASE-5.3.1-TEST-AUDIT.md'
          test -z "$(git ls-files --others --exclude-standard -- backend frontend)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - id: runtime
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        env:
          BUILDX_GIT_CHECK_DIRTY: 'false'
          BUILDX_GIT_INFO: 'true'
          BUILDX_GIT_LABELS: 'false'
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: homecloud-ci-${{ matrix.component }}:${{ github.sha }}
          build-args: |
            NODE_IMAGE=${{ steps.bases.outputs.node }}
            NGINX_IMAGE=${{ steps.bases.outputs.nginx }}
      - name: Backend production image native dependencies, without mounts or startup
        if: matrix.component == 'backend'
        env:
          IMAGE: homecloud-ci-backend:${{ github.sha }}
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint node "$IMAGE" -e '
          const assert=require("node:assert/strict");
          const fs=require("node:fs");
          const {spawnSync}=require("node:child_process");
          const sharp=require("sharp");
          assert.equal(process.getuid(),1001);
          assert.equal(process.version,"v24.21.0");
          for(const path of ["/usr/local/lib/node_modules/npm","/usr/local/bin/npm","/usr/local/bin/npx"]){assert.equal(fs.existsSync(path),false);}
          for(const path of ["/storage","/storage/.tmp"]){const stat=fs.statSync(path);assert.equal(stat.uid,1001);assert.equal(stat.mode & 0o777,0o700);}
          const cli=spawnSync(process.execPath,["./node_modules/typeorm/cli.js","migration:run","--help"],{encoding:"utf8",timeout:10000});
          assert.ifError(cli.error);assert.equal(cli.status,0);assert.match(cli.stdout,/transaction/);
          assert.equal(sharp.versions.sharp,"0.35.5");
          require("./native/secure-fs.node");
          sharp({create:{width:20,height:10,channels:3,background:"#336699"}}).jpeg().toBuffer()
          .then(input=>sharp(input).resize(10,10,{fit:"inside"}).png().toBuffer())
          .then(output=>sharp(output).metadata())
          .then(meta=>{assert.equal(meta.width,10);assert.equal(meta.height,5);console.log("PASS: linux/amd64 musl native addon and image decoder");})
          .catch(error=>{console.error(error.message);process.exitCode=1;});'
      - name: Frontend nginx template compatibility, without mounts or service startup
        if: matrix.component == 'frontend'
        env:
          IMAGE: homecloud-ci-frontend:${{ github.sha }}
        run: |
          docker run --rm --network none --cap-drop ALL --cap-add CHOWN --security-opt no-new-privileges --add-host backend:127.0.0.1 --env INGRESS_PROXY_IP=127.0.0.2 "$IMAGE" nginx -t
      - name: Verify runtime image architecture
        env:
          IMAGE: homecloud-ci-${{ matrix.component }}:${{ github.sha }}
        run: test "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
      - name: Build offline OCI provenance candidate
        id: offline
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        env:
          BUILDX_GIT_CHECK_DIRTY: 'false'
          BUILDX_GIT_INFO: 'true'
          BUILDX_GIT_LABELS: 'false'
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64
          push: false
          load: false
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.component }}.oci.tar
          provenance: mode=max,version=v0.2
          tags: ghcr.io/${{ steps.source.outputs.repository }}/${{ matrix.component }}:dry-run
          labels: |
            org.opencontainers.image.source=https://github.com/${{ steps.source.outputs.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.version=dry-run
            io.homecloud.role=${{ matrix.component }}
            io.homecloud.pair=${{ steps.source.outputs.commit }}
          build-args: |
            NODE_IMAGE=${{ steps.bases.outputs.node }}
            NGINX_IMAGE=${{ steps.bases.outputs.nginx }}
      - name: Verify offline OCI digest, source and attestation
        env:
          BUILD_METADATA: ${{ steps.offline.outputs.metadata }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          REPOSITORY: ${{ steps.source.outputs.repository }}
        run: |
          python3 -c 'import os; open("offline-${{ matrix.component }}-metadata.json", "w").write(os.environ["BUILD_METADATA"])'
          python3 scripts/ci/provenance.py dry-run --archive "$RUNNER_TEMP/${{ matrix.component }}.oci.tar" --metadata "offline-${{ matrix.component }}-metadata.json" --component "${{ matrix.component }}" --commit "$SOURCE_COMMIT" --repository "$REPOSITORY" --output "offline-${{ matrix.component }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: offline-provenance-${{ matrix.component }}-${{ github.run_attempt }}
          path: offline-${{ matrix.component }}*.json
          if-no-files-found: error
          retention-days: 14
      - name: Install checksum-pinned scanner
        id: scanner
        if: always() && steps.runtime.outcome == 'success'
        run: sh scripts/ci/install-trivy.sh "$RUNNER_TEMP/homecloud-trivy"
      - name: Scan actual runtime image, including unfixed vulnerabilities
        if: always() && steps.runtime.outcome == 'success' && steps.scanner.outcome == 'success'
        run: sh scripts/ci/scan-image.sh "$RUNNER_TEMP/homecloud-trivy/trivy" docker "homecloud-ci-${{ matrix.component }}:${{ github.sha }}" "image-${{ matrix.component }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: image-scan-${{ matrix.component }}-${{ github.run_attempt }}
          path: image-${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 14
  provenance-pair:
    if: always()
    needs: [image-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: offline-provenance-backend-${{ github.run_attempt }}
          path: offline-backend
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: offline-provenance-frontend-${{ github.run_attempt }}
          path: offline-frontend
      - name: Bind verified image pair to synthetic tag and dry-run manifest
        run: |
          python3 scripts/ci/provenance-pair.py --backend offline-backend/offline-backend.json --frontend offline-frontend/offline-frontend.json --commit "$(git rev-parse HEAD)" --repository "${GITHUB_REPOSITORY,,}" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --output provenance-dry-run.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: provenance-dry-run-${{ github.run_attempt }}
          path: provenance-dry-run.json
          if-no-files-found: error
          retention-days: 14
  base-image-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        base: [node, nginx, postgres, node-ci]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Install checksum-pinned scanner
        run: sh scripts/ci/install-trivy.sh "$RUNNER_TEMP/homecloud-trivy"
      - name: Scan pinned linux/amd64 base, including unfixed vulnerabilities
        env:
          BASE: ${{ matrix.base }}
        run: |
          if [ "$BASE" = node-ci ]; then
            IMAGE=node:24.21.0-bookworm-slim@sha256:51b1100cc2a83d370c6a60952e3f2989c8a43159d0e38586e090f3b3326efefd
          else
            IMAGE=$(python3 -c 'import json,os; print(json.load(open("scripts/ci/images.lock.json"))[os.environ["BASE"]])')
          fi
          sh scripts/ci/scan-image.sh "$RUNNER_TEMP/homecloud-trivy/trivy" remote "$IMAGE" "image-base-$BASE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: image-scan-base-${{ matrix.base }}-${{ github.run_attempt }}
          path: image-base-${{ matrix.base }}.json
          if-no-files-found: error
          retention-days: 14
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit
        working-directory: ${{ matrix.component }}
      - name: Capture audit response, reject infrastructure errors
        shell: bash
        working-directory: ${{ matrix.component }}
        run: |
          set +e
          npm audit --json > ../audit-${{ matrix.component }}.json
          result=$?
          set -e
          test "$result" -le 1
      - run: python3 scripts/ci/audit-gate.py audit-${{ matrix.component }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: audit-${{ matrix.component }}-${{ github.run_attempt }}
          path: audit-${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 14
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned gitleaks; full reachable history, forbidden audit excluded before reading
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --log-opts="--all -- . :(exclude)scripts/tests/PHASE-5.3.1-TEST-AUDIT.md" .
  gate:
    if: always()
    needs: [backend, frontend, configuration, image-build, provenance-pair, base-image-scan, security, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os; r=json.loads(os.environ["RESULTS"]); assert all(j["result"]=="success" for j in r.values()), "CI gates failed or skipped"'
