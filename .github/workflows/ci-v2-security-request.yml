# Manual request: add the ci-security-qualification label to the final PR candidate.
# This PR-event caller keeps the original pull_request context in both reusable workflows.
name: HomeCloud CI v2 Security request
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  pull-requests: read
jobs:
  requested-qualification:
    name: ci-v2-security-request
    if: ${{ github.event.label.name == 'ci-security-qualification' && github.event.sender.login == github.repository_owner }}
    uses: ./.github/workflows/ci-v2-security.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
    permissions:
      contents: read
      pull-requests: read
