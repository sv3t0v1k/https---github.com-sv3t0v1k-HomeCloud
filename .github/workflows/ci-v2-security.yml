# Dormant compatibility qualification. It retains the current security gate.
# A future trusted PR workflow may call it once for an unchanged final candidate.
name: HomeCloud Security Qualification v2 candidate
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      base_sha:
        type: string
        required: true
      candidate_version:
        type: string
        required: false
        default: dry-run
permissions:
  contents: read
  pull-requests: read
jobs:
  qualification:
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      candidate_version: ${{ inputs.candidate_version }}
      qualification_profile: pull-request
    permissions:
      contents: read
  final-candidate:
    name: ci-v2-security-terminal
    if: always()
    needs: [qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: always()
        with:
          name: production-qualification-${{ github.run_attempt }}
          path: qualified
      - name: Require successful qualification and unchanged candidate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          test "$QUALIFICATION_RESULT" = success
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "${{ github.event_name }}" = pull_request
          gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}" > "$RUNNER_TEMP/current-pr.json"
          python3 scripts/ci/ci-v2-candidate.py --event "$GITHUB_EVENT_PATH" --live "$RUNNER_TEMP/current-pr.json" --checkout "$SOURCE_SHA" --expected-base "$BASE_SHA" --qualification qualified/production-qualification.json --expected-profile pull-request --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --require-base-ancestor
