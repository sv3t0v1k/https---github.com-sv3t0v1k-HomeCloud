name: HomeCloud PR Fast + Integration v2
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [test]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-v2-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pr-fast-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    container: node:24.21.0-bookworm-slim@sha256:51b1100cc2a83d370c6a60952e3f2989c8a43159d0e38586e090f3b3326efefd
    steps:
      - name: Patch CI Perl and install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gcc libc6-dev git python3 unzip util-linux perl-base=5.36.0-7+deb12u4
          test "$(dpkg-query -W -f='${Version}' perl-base)" = 5.36.0-7+deb12u4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 scripts/ci/install-npm.py
      - run: npm ci --no-audit
        working-directory: backend
      - run: sh native/build.sh
        working-directory: backend
      - run: python3 scripts/ci/test-ci-v2-fast-gate.py
      - run: python3 scripts/ci/test-ci-v2-candidate.py
      - run: python3 scripts/ci/test-test-channel.py
      - run: python3 scripts/ci/test-test-job.py
      - run: python3 scripts/ci/test-secret-findings.py
      - run: python3 scripts/ci/test-install-npm.py
      - run: python3 scripts/ci/test-test-routing.py
      - name: Route all unit suites, including critical smoke
        run: python3 scripts/ci/test-routing.py list unit > backend-unit-suites.txt
      - name: Run unit suites without PostgreSQL or bench suites
        shell: bash
        working-directory: backend
        run: |
          mapfile -t suites < ../backend-unit-suites.txt
          test "${#suites[@]}" -gt 0
          chown -R node:node "$GITHUB_WORKSPACE"
          runuser -u node -- npm test -- --runInBand --runTestsByPath "${suites[@]}" --json --outputFile=../backend-unit-tests.json
      - run: python3 scripts/ci/test-routing.py verify unit backend-unit-tests.json
      - run: npm run lint
        working-directory: backend
      - run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: node test/file-type-compiled-runtime.cjs
        working-directory: backend
      - name: Patched dependency runtime and multipart boundaries
        run: runuser -u node -- node --test --test-timeout=10000 test/dependency-security-runtime.cjs
        working-directory: backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-unit-tests-${{ github.run_attempt }}
          path: backend-unit-tests.json
          if-no-files-found: error
          retention-days: 14
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    container: node:24.21.0-bookworm-slim@sha256:51b1100cc2a83d370c6a60952e3f2989c8a43159d0e38586e090f3b3326efefd
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: homecloud_ci
          POSTGRES_USER: homecloud_ci
          POSTGRES_PASSWORD: disposable-ci-only
        options: >-
          --health-cmd "pg_isready -U homecloud_ci -d homecloud_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HOMECLOUD_TEST_DATABASE_URL: postgres://homecloud_ci:disposable-ci-only@postgres:5432/homecloud_ci
    steps:
      - name: Patch CI Perl and install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gcc libc6-dev git python3 unzip util-linux perl-base=5.36.0-7+deb12u4
          test "$(dpkg-query -W -f='${Version}' perl-base)" = 5.36.0-7+deb12u4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install checksum-pinned compatible npm before dependency commands
        run: python3 scripts/ci/install-npm.py
      - run: npm ci --no-audit
        working-directory: backend
      - run: sh native/build.sh
        working-directory: backend
      - name: Route PostgreSQL, concurrency, filesystem and bench suites
        run: python3 scripts/ci/test-routing.py list integration > backend-integration-suites.txt
      - name: Integration suites as unprivileged user
        shell: bash
        run: |
          mapfile -t suites < ../backend-integration-suites.txt
          test "${#suites[@]}" -gt 0
          report_dir="$PWD/.ci-reports"
          install -d -o node -g node -m 0700 "$report_dir"
          runuser -u node -- sh -c 'test -w "$1" && : > "$1/.write-check" && rm "$1/.write-check"' sh "$report_dir"
          runuser -u node -- npm test -- --runInBand --runTestsByPath "${suites[@]}" --json --outputFile="$report_dir/backend-integration-tests.json"
        working-directory: backend
      - run: python3 scripts/ci/test-routing.py verify integration backend/.ci-reports/backend-integration-tests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-integration-tests-${{ github.run_attempt }}
          path: backend/.ci-reports/backend-integration-tests.json
          if-no-files-found: error
          retention-days: 14
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install checksum-pinned compatible npm before dependency commands
        run: python3 scripts/ci/install-npm.py
      - run: npm ci --no-audit
        working-directory: frontend
      - name: Run all frontend unit suites with a checked report
        run: npm test -- --reporter=json --outputFile=../frontend-tests.json
        working-directory: frontend
      - run: python3 scripts/ci/test-routing.py verify frontend frontend-tests.json
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-tests-${{ github.run_attempt }}
          path: frontend-tests.json
          if-no-files-found: error
          retention-days: 14
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin normalized Compose API; preserve explicit false bind flags
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/homecloud-compose-bin"
          curl --fail --silent --show-error --location https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64 -o "$RUNNER_TEMP/homecloud-compose-bin/docker-compose"
          echo "40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a  $RUNNER_TEMP/homecloud-compose-bin/docker-compose" | sha256sum --check
          chmod +x "$RUNNER_TEMP/homecloud-compose-bin/docker-compose"
          cat > "$RUNNER_TEMP/homecloud-compose-bin/docker" <<'SHIM'
          #!/bin/sh
          set -eu
          [ "$#" -ge 1 ] && [ "$1" = compose ] || { echo 'CI configuration helper supports compose only' >&2; exit 1; }
          shift
          exec "$(dirname "$0")/docker-compose" "$@"
          SHIM
          chmod +x "$RUNNER_TEMP/homecloud-compose-bin/docker"
          echo "$RUNNER_TEMP/homecloud-compose-bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/homecloud-compose-bin/docker" compose version --short)" = 5.6.0
      - run: docker compose version && python3 scripts/ci/compose-check.py
      - run: python3 deploy/linux/test_startup_gate.py
      - run: python3 scripts/ci/test-entrypoint.py
      - run: python3 deploy/linux/test_preflight.py
        env:
          HOMECLOUD_TEST_ROOT: ${{ github.workspace }}
      - name: Isolated recovery contract tests with fake Docker
        run: |
          sudo mkdir -p /private/tmp
          sudo chmod 1777 /private/tmp
          python3 scripts/tests/test-restore-schema.py
          python3 scripts/tests/test-restore-preflight.py
          python3 scripts/tests/test-restore-cleanup.py
          python3 scripts/tests/test-restore-health.py
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned gitleaks; full reachable history, forbidden audit excluded before reading
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          mkdir "$RUNNER_TEMP/gitleaks-evidence"
          set +e
          "$RUNNER_TEMP/gitleaks" git --redact=100 --exit-code 42 --report-format json --report-path "$RUNNER_TEMP/gitleaks-evidence/raw-redacted.json" --log-opts="--all -- . :(exclude)scripts/tests/PHASE-5.3.1-TEST-AUDIT.md" .
          scanner_result=$?
          set -e
          python3 scripts/ci/secret-findings.py --report "$RUNNER_TEMP/gitleaks-evidence/raw-redacted.json" --scanner-exit "$scanner_result" --output "$RUNNER_TEMP/gitleaks-evidence/classification.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: secret-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gitleaks-evidence
          if-no-files-found: error
          retention-days: 90
  fast-integration-gate:
    name: ci-v2-fast-terminal
    if: always()
    needs: [pr-fast-backend, backend, frontend, configuration, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require all Fast and Integration jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/ci-v2-fast-gate.py --results "$RESULTS"
      - name: Require unchanged PR HEAD and base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}" > "$RUNNER_TEMP/current-pr.json"
          python3 scripts/ci/ci-v2-candidate.py --event "$GITHUB_EVENT_PATH" --live "$RUNNER_TEMP/current-pr.json" --checkout "$(git rev-parse HEAD)"
      - name: Require unchanged test branch HEAD
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/branches/test" > "$RUNNER_TEMP/current-test.json"
          python3 scripts/ci/ci-v2-candidate.py --event "$GITHUB_EVENT_PATH" --live "$RUNNER_TEMP/current-test.json" --checkout "$(git rev-parse HEAD)" --branch test
  test-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    needs: fast-integration-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind source to protected test branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/branches/test" > "$RUNNER_TEMP/current-test.json"
          python3 scripts/ci/ci-v2-candidate.py --event "$GITHUB_EVENT_PATH" --live "$RUNNER_TEMP/current-test.json" --checkout "$(git rev-parse HEAD)" --branch test
          test "$(python3 -c 'import json,os; print(str(json.load(open(os.environ["RUNNER_TEMP"]+"/current-test.json"))["protected"]).lower())')" = true
      - id: source
        run: |
          git diff --quiet HEAD
          test -z "$(git ls-files --others --exclude-standard -- backend frontend)"
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: bases
        run: |
          python3 -c 'import json,os; d=json.load(open("scripts/ci/images.lock.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); [f.write(k+"="+v+"\n") for k,v in d.items()]'
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit@sha256:98cc6a3fc46220d00f8224ae483f3274fc874e9be8d7dd1e2e2c5481209228b5
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish TEST-only linux/amd64 image with provenance
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        env:
          BUILDX_GIT_CHECK_DIRTY: 'false'
          BUILDX_GIT_INFO: 'true'
          BUILDX_GIT_LABELS: 'false'
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64
          push: true
          provenance: mode=max,version=v0.2
          tags: ghcr.io/${{ steps.source.outputs.repository }}/${{ matrix.component }}:test-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ steps.source.outputs.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=test-${{ github.sha }}
            io.homecloud.role=${{ matrix.component }}
            io.homecloud.pair=${{ github.sha }}
          build-args: |
            NODE_IMAGE=${{ steps.bases.outputs.node }}
            NGINX_IMAGE=${{ steps.bases.outputs.nginx }}
      - name: Record exact registry index digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 -c 'import os,re,pathlib; d=os.environ["DIGEST"]; assert re.fullmatch("sha256:[a-f0-9]{64}",d); pathlib.Path("${{ matrix.component }}.digest").write_text(d+"\n")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-digest-${{ matrix.component }}-${{ github.run_attempt }}
          path: ${{ matrix.component }}.digest
          if-no-files-found: error
          retention-days: 90
  test-pair:
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    needs: test-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-digest-backend-${{ github.run_attempt }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-digest-frontend-${{ github.run_attempt }}
      - name: Verify current protected source and exact remote provenance pair
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/branches/test" > "$RUNNER_TEMP/current-test.json"
          python3 scripts/ci/ci-v2-candidate.py --event "$GITHUB_EVENT_PATH" --live "$RUNNER_TEMP/current-test.json" --checkout "$(git rev-parse HEAD)" --branch test
          test "$(python3 -c 'import json,os; print(str(json.load(open(os.environ["RUNNER_TEMP"]+"/current-test.json"))["protected"]).lower())')" = true
          python3 scripts/ci/test-channel.py create --manifest test-channel.json --commit "$GITHUB_SHA" --repository "${GITHUB_REPOSITORY,,}" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --backend "$(cat backend.digest)" --frontend "$(cat frontend.digest)"
          python3 scripts/ci/test-channel.py check --manifest test-channel.json
          echo "sha256=$(python3 -c 'import json; print(json.load(open("test-channel.json"))["manifest_sha256"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-channel-${{ github.run_attempt }}
          path: test-channel.json
          if-no-files-found: error
          retention-days: 90
  test-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/test' && vars.TEST_AUTO_DEPLOY_ENABLED == 'true'
    needs: test-pair
    environment: test-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-channel-${{ github.run_attempt }}
      - name: Deliver manifest to restricted mini-PC command
        env:
          TEST_DEPLOY_KEY: ${{ secrets.TEST_DEPLOY_KEY }}
          TEST_DEPLOY_KNOWN_HOSTS: ${{ secrets.TEST_DEPLOY_KNOWN_HOSTS }}
          TEST_DEPLOY_TARGET: ${{ vars.TEST_DEPLOY_TARGET }}
          EXPECTED_MANIFEST: ${{ needs.test-pair.outputs.manifest_sha256 }}
        run: |
          test -n "$TEST_DEPLOY_KEY" && test -n "$TEST_DEPLOY_KNOWN_HOSTS" && test -n "$TEST_DEPLOY_TARGET"
          python3 -c 'import os,re; assert re.fullmatch(r"[a-z_][a-z0-9_-]*@[A-Za-z0-9.-]+", os.environ["TEST_DEPLOY_TARGET"]), "invalid restricted SSH target"'
          python3 -c 'import hashlib,json,os; m=json.load(open("test-channel.json")); h=lambda x: hashlib.sha256(json.dumps(x,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()).hexdigest(); assert m["commit"]==os.environ["GITHUB_SHA"] and m["manifest_sha256"]==os.environ["EXPECTED_MANIFEST"] and h({k:v for k,v in m.items() if k!="manifest_sha256"})==m["manifest_sha256"]'
          umask 077
          printf '%s\n' "$TEST_DEPLOY_KEY" > "$RUNNER_TEMP/test-deploy-key"
          printf '%s\n' "$TEST_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/test-known-hosts"
          # A durable root-only manifest and independent systemd service outlive SSH.
          # Never resubmit automatically after an ambiguous SSH acknowledgement.
          ssh_opts=(-i "$RUNNER_TEMP/test-deploy-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$RUNNER_TEMP/test-known-hosts" -o BatchMode=yes
                    -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          submit=$(ssh "${ssh_opts[@]}" "$TEST_DEPLOY_TARGET" \
            'sudo -n /home/hs/homecloud-test/deploy/linux/project-test.sh test-submit' < test-channel.json) || {
            echo 'STOP: submission acknowledgement lost; inspect job on mini-PC; do not retry blindly' >&2
            exit 1
          }
          SUBMIT_JSON="$submit" python3 - <<'PYCODE'
          import json, os
          item = json.loads(os.environ['SUBMIT_JSON'])
          assert item['manifest_sha256'] == os.environ['EXPECTED_MANIFEST']
          assert item['status'] in ('ACCEPTED', 'QUEUED', 'RUNNING', 'INSTALLED')
          PYCODE
          # The status query is read-only. Transient SSH failures never cancel
          # the detached service, and never count as an install success.
          for ((attempt=0; attempt<990; attempt++)); do
            if status=$(ssh "${ssh_opts[@]}" "$TEST_DEPLOY_TARGET" \
                'sudo -n /home/hs/homecloud-test/deploy/linux/project-test.sh test-job-status'); then
              result=$(STATUS_JSON="$status" python3 - <<'PYCODE'
          import json, os
          item = json.loads(os.environ['STATUS_JSON'])
          assert item['manifest_sha256'] == os.environ['EXPECTED_MANIFEST']
          assert item['status'] in ('QUEUED', 'RUNNING', 'INSTALLED', 'STOP', 'UNKNOWN_REQUIRES_REVIEW')
          print(item['status'])
          PYCODE
              ) || exit 1
              case "$result" in
                INSTALLED) echo 'TEST installation confirmed from durable job checkpoint'; exit 0;;
                QUEUED|RUNNING) ;;
                *) echo 'STOP: TEST job requires operator inspection' >&2; exit 1;;
              esac
            else
              echo 'SSH status temporarily unavailable; detached TEST job is not cancelled' >&2
            fi
            sleep 10
          done
          echo 'STOP: TEST job status deadline reached; check mini-PC before retrying' >&2
          exit 1
