name: Узкий эксперимент остаточных PostgreSQL findings D5.1.11
on:
  push:
    paths:
      - 'experiments/d5-1-11/**'
      - '.github/workflows/pg-residual-experiment.yml'
permissions:
  contents: read
  actions: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/d5-1-11
            scripts/ci/install-trivy.sh
            scripts/ci/oci-scan-binding.py
            scripts/ci/provenance.py
          sparse-checkout-cone-mode: false
      - name: Подготовить одноразовый runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          sh scripts/ci/install-trivy.sh "$RUNNER_TEMP/d5111-trivy"
      - name: Получить закреплённый предыдущий OCI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38981697774 --repo "$GITHUB_REPOSITORY" -n d5110-experimental-image-1 -D "$RUNNER_TEMP/d5111-previous"
      - name: Квалифицировать минимальное обновление
        env:
          D5111_PREVIOUS_ARCHIVE: ${{ runner.temp }}/d5111-previous/candidate.oci.tar
        run: python3 experiments/d5-1-11/qualify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: d5111-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/d5111/evidence
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: d5111-experimental-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/d5111/candidate.oci.tar
          if-no-files-found: ignore
          retention-days: 30
