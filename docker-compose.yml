services:
  db:
    image: postgres:16-alpine
    container_name: homedb
    environment:
      POSTGRES_DB: ${DB_NAME:-homecloud}
      POSTGRES_USER: ${DB_USER:-homecloud}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: homeredis
    command: >
      sh -c 'redis-server
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}'
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homebackend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${DB_USER:-homecloud}:${DB_PASSWORD}@db:5432/${DB_NAME:-homecloud}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      STORAGE_PATH: /storage
      MAX_FILE_SIZE: 0
      CHUNK_SIZE: 10485760
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - storage_data:/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homefrontend
    environment:
      VITE_API_URL: ${API_URL:-http://localhost:3000}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  storage_data:
  uploads_data:

networks:
  app_network:
    driver: bridge