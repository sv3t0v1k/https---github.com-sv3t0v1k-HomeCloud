# Необязательный Mac/dev override. Основной docker-compose.yml уже работает на Mac.
# Для frontend HMR: npm ci && npm run dev -- --host 127.0.0.1 (из frontend/).
# Vite proxy обращается только к loopback API ниже; затем UI http://localhost:5173.
# docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build --wait
services:
  backend:
    ports:
      - "127.0.0.1:3000:3000"
    networks: [app_network, web_network]
    environment:
      FRONTEND_URL: http://localhost:5173
  # Это opt-in доступ к internal health/API для разработки. Не применять на mini-PC.
