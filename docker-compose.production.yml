# Linux mini-PC: ТОЛЬКО override основного Compose, не standalone файл.
# docker compose --env-file /etc/homecloud/runtime.env -f docker-compose.yml \
#   -f docker-compose.production.yml config --quiet
# Подготовка без запуска на mini-PC; реальная работоспособность там НЕ проверена.
# SSD сейчас содержит БД; HDD содержит permanent files И legacy .tmp.
# SSD upload workspace не подключён и OFF. Не добавлять privileged/capabilities.
# Запуск только после deploy/linux/preflight.py через systemd; no исключает обход
# host mount gate автоматическим Docker restart после reboot/daemon restart.
services:
  db:
    restart: "no"
    volumes: !override
      - type: bind
        source: ${SSD_DB_DIR:?Укажите существующий каталог БД на SSD}
        target: /var/lib/postgresql/data
        bind: {create_host_path: false}
  backend:
    restart: "no"
    # Явный UID/GID совпадает с nextjs и D1 restore ownership (id -g nextjs).
    user: "1001:65533"
    environment:
      NODE_ENV: production
      FRONTEND_URL: https://${PUBLIC_HOST:?Укажите публичное DNS имя}
      REDIS_PASSWORD: ""
      TRUSTED_PROXY_IP: ${FRONTEND_PROXY_IP:-172.30.0.10}
      UPLOAD_SSD_ENABLED: "false"
      UPLOAD_SSD_RECOVERY_MODE: manual
    # /storage сохраняется: migration520 и существующие DB bindings зависят от него.
    # На host проверить mount/source, UID1001, mode0700, marker и .tmp ДО startup.
    volumes: !override
      - type: bind
        source: ${HDD_STORAGE_DIR:?Укажите существующий storage каталог на HDD}
        target: /storage
        bind: {create_host_path: false}
    networks: !override
      app_network:
      backend_proxy:
  frontend:
    restart: "no"
    # !override действительно удаляет Mac port, не добавляет к нему новые bindings.
    ports: !override []
    environment:
      INGRESS_PROXY_IP: ${INGRESS_PROXY_IP:-172.29.0.10}
    networks: !override
      backend_proxy:
        ipv4_address: ${FRONTEND_PROXY_IP:-172.30.0.10}
      ingress_frontend:
  ingress:
    image: nginx:1.28-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Укажите публичное DNS имя}
      NGINX_ENVSUBST_FILTER: ^PUBLIC_HOST$
    ports:
      - "${PUBLIC_BIND_IP:-0.0.0.0}:80:80"
      - "${PUBLIC_BIND_IP:-0.0.0.0}:443:443"
    volumes:
      - ./deploy/ingress/19-validate-public-host.sh:/docker-entrypoint.d/19-validate-public-host.sh:ro
      - ./deploy/ingress/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/ingress/upgrade.conf:/etc/nginx/conf.d/upgrade.conf:ro
      - type: bind
        source: ${TLS_CERT_DIR:?Укажите каталог TLS current/fullchain.pem и privkey.pem}
        target: /etc/nginx/tls
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${ACME_WEBROOT_DIR:?Укажите существующий ACME webroot}
        target: /var/www/acme
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      frontend: {condition: service_healthy}
    networks:
      ingress_frontend:
        ipv4_address: ${INGRESS_PROXY_IP:-172.29.0.10}
    restart: "no"
    mem_limit: 128m
    healthcheck:
      # Listener/UI probe, не доказательство доверия CA, сертификата или внешнего DNS.
      test: [CMD-SHELL, 'wget --no-check-certificate -q -O /dev/null --header="Host: $$PUBLIC_HOST" https://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Опциональный Redis тоже не должен обходить Linux host gate.
  redis:
    restart: "no"

networks:
  # Две exact IP нужны текущему контракту proxy trust, не произвольное доверие подсети.
  # Проверить конфликты host/VPN/Docker; менять subnet И соответствующий IP вместе.
  backend_proxy:
    driver: bridge
    internal: true
    ipam:
      config: [{subnet: "${BACKEND_PROXY_SUBNET:-172.30.0.0/24}"}]
  ingress_frontend:
    driver: bridge
    ipam:
      config: [{subnet: "${INGRESS_SUBNET:-172.29.0.0/24}"}]
