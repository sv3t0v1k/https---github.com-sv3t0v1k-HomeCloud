# Linux mini-PC: ТОЛЬКО override основного Compose, не standalone файл.
# docker compose --env-file /etc/homecloud/runtime.env -f docker-compose.yml \
#   -f docker-compose.production.yml config --quiet
# Подготовка без запуска на mini-PC; реальная работоспособность там НЕ проверена.
# SSD сейчас содержит БД; HDD содержит permanent files И legacy .tmp.
# SSD upload workspace не подключён и OFF. Не добавлять privileged/capabilities.
# Каждый старт DB/backend проходит gate ДО writer. Host preflight — проверка подготовки.
# systemd не обязателен: ранний Docker restart безопасно отказывается при missing mount.
name: ${COMPOSE_PROJECT_NAME:?Укажите отдельный production Compose project}
services:
  db:
    image: docker.io/library/postgres:16.15-alpine@sha256:1a66d744c1b459e13b05a8fca341da84cb63383e99ce262210efee5a319d4551
    platform: linux/amd64
    entrypoint: [sh, /run/homecloud/startup-gate.sh, db]
    command: [postgres]
    restart: unless-stopped
    volumes: !override
      - type: bind
        source: ${SSD_DB_DIR:?Укажите существующий каталог БД на SSD}
        target: /var/lib/postgresql/data
        bind: {create_host_path: false}
      - type: bind
        source: ./deploy/linux/startup-gate.sh
        target: /run/homecloud/startup-gate.sh
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/homecloud/startup-db.gate
        target: /run/homecloud/startup.gate
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /proc/1/mountinfo
        target: /run/homecloud/host-mountinfo
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /dev
        target: /run/homecloud/dev
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${SSD_DB_DIR}/../.homecloud-db
        target: /run/homecloud/volume-marker
        read_only: true
        bind: {create_host_path: false}
  backend:
    platform: linux/amd64
    entrypoint: [sh, /run/homecloud/startup-gate.sh, backend]
    command: [node, dist/main.js]
    restart: unless-stopped
    # Явный UID/GID совпадает с nextjs и D1 restore ownership (id -g nextjs).
    user: "1001:65533"
    environment:
      NODE_ENV: production
      FRONTEND_URL: ${PUBLIC_ORIGIN:?Укажите точный внешний HTTPS origin без trailing slash}
      REDIS_PASSWORD: ""
      TRUSTED_PROXY_IP: ${FRONTEND_PROXY_IP:?Укажите exact frontend peer IP}
      UPLOAD_SSD_ENABLED: "false"
      UPLOAD_SSD_RECOVERY_MODE: manual
    # /storage сохраняется: migration520 и существующие DB bindings зависят от него.
    # На host проверить mount/source, UID1001, mode0700, marker и .tmp ДО startup.
    volumes: !override
      - type: bind
        source: ${HDD_STORAGE_DIR:?Укажите существующий storage каталог на HDD}
        target: /storage
        bind: {create_host_path: false}
      - type: bind
        source: ./deploy/linux/startup-gate.sh
        target: /run/homecloud/startup-gate.sh
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/homecloud/startup-backend.gate
        target: /run/homecloud/startup.gate
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /proc/1/mountinfo
        target: /run/homecloud/host-mountinfo
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /dev
        target: /run/homecloud/dev
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${HDD_STORAGE_DIR}/../.homecloud-backend
        target: /run/homecloud/volume-marker
        read_only: true
        bind: {create_host_path: false}
    networks: !override
      app_network:
      backend_proxy:
  frontend:
    platform: linux/amd64
    restart: unless-stopped
    # !override действительно удаляет Mac port, не добавляет к нему новые bindings.
    ports: !override []
    environment:
      INGRESS_PROXY_IP: ${INGRESS_PROXY_IP:?Укажите exact ingress peer IP}
    networks: !override
      backend_proxy:
        ipv4_address: ${FRONTEND_PROXY_IP:?Укажите exact frontend peer IP}
      ingress_frontend:
  ingress:
    image: docker.io/library/nginx:1.28.3-alpine@sha256:0dcc88822d45581e65ae329f8be769762bf628d3b2bb7d2a077d4aa5c98b30e3
    platform: linux/amd64
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Укажите публичное DNS имя}
      NGINX_ENVSUBST_FILTER: ^PUBLIC_HOST$
    ports:
      - "${PUBLIC_BIND_IP:-127.0.0.1}:${PUBLIC_HTTP_PORT:?Укажите свободный HTTP port HomeCloud}:80"
      - "${PUBLIC_BIND_IP:-127.0.0.1}:${PUBLIC_HTTPS_PORT:?Укажите свободный HTTPS port HomeCloud}:443"
    volumes:
      - ./deploy/ingress/19-validate-public-host.sh:/docker-entrypoint.d/19-validate-public-host.sh:ro
      - ./deploy/ingress/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/ingress/upgrade.conf:/etc/nginx/conf.d/upgrade.conf:ro
      - type: bind
        source: ${TLS_CERT_DIR:?Укажите каталог TLS current/fullchain.pem и privkey.pem}
        target: /etc/nginx/tls
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${ACME_WEBROOT_DIR:?Укажите существующий ACME webroot}
        target: /var/www/acme
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      frontend: {condition: service_healthy}
    networks:
      ingress_frontend:
        ipv4_address: ${INGRESS_PROXY_IP:?Укажите exact ingress peer IP}
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      # Listener/UI probe, не доказательство доверия CA, сертификата или внешнего DNS.
      test: [CMD-SHELL, 'wget --no-check-certificate -q -O /dev/null --header="Host: $$PUBLIC_HOST" https://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Redis не входит в production HomeCloud; отдельный профиль исключает случайный запуск.
  redis:
    profiles: !override [unqualified-production-redis]
    restart: "no"

networks:
  # Две exact IP нужны текущему контракту proxy trust, не произвольное доверие подсети.
  # Проверить конфликты host/VPN/Docker; менять subnet И соответствующий IP вместе.
  backend_proxy:
    driver: bridge
    internal: true
    ipam:
      config: [{subnet: "${BACKEND_PROXY_SUBNET:?Укажите свободную backend proxy subnet}"}]
  ingress_frontend:
    driver: bridge
    ipam:
      config: [{subnet: "${INGRESS_SUBNET:?Укажите свободную ingress subnet}"}]
