# Only the production ingress may supply client/protocol metadata.
set_real_ip_from 172.29.0.10;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
map $realip_remote_addr $authoritative_proto {
  default $scheme;
  172.29.0.10 $http_x_forwarded_proto;
}
map $realip_remote_addr $authoritative_host {
  default $host;
  172.29.0.10 $http_x_forwarded_host;
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Operational endpoints have no browser/public route, including optional
  # Express trailing slash, duplicate slash and case-insensitive aliases.
  location ~* ^/(?:api/(?:v1/)?)?(?:health|metrics)(?:/|$) { return 404; }

  location / { try_files $uri $uri/ /index.html; }
  location ~ ^/api/v1/uploads/session/[^/]+/chunk$ {
    client_max_body_size 51m;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_pass http://homebackend:3000;
    proxy_set_header Host $authoritative_host;
    proxy_set_header X-Forwarded-Host $authoritative_host;
    proxy_set_header X-Forwarded-Proto $authoritative_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /api/ {
    proxy_pass http://homebackend:3000;
    proxy_set_header Host $authoritative_host;
    proxy_set_header X-Forwarded-Host $authoritative_host;
    proxy_set_header X-Forwarded-Proto $authoritative_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /socket.io/ {
    proxy_pass http://homebackend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $authoritative_host;
    proxy_set_header X-Forwarded-Host $authoritative_host;
    proxy_set_header X-Forwarded-Proto $authoritative_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
